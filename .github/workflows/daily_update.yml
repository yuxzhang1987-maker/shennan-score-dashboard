
name: Daily Shennan Score Update
on:
  workflow_dispatch:
  schedule:
    # 17:30 Taiwan/China time on weekdays
    - cron: "30 9 * * 1-5"
permissions:
  contents: write
jobs:
  update-score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas numpy
      - run: python update_data.py
      - name: Commit history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.csv
          git diff --cached --quiet || git commit -m "Update daily Shennan score"
          git push
