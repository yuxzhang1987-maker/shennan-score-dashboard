name: Hourly Shennan Score Update
on:
  workflow_dispatch:
  schedule:
    # 每小时运行；覆盖A股交易时段并在非交易时段更新可获得的海外数据。
    # UTC 01:05-07:05 = 北京时间09:05-15:05，周一至周五。
    - cron: "5 1-7 * * 1-5"
permissions:
  contents: write
jobs:
  update-score:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Update scores and send threshold alerts
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          TZ: Asia/Shanghai
        run: python update_data.py
      - name: Collect 5-minute bars and update T signals
        env:
          TZ: Asia/Shanghai
        continue-on-error: true
        run: |
          python - <<'PY'
          import intraday_t_model as t
          bars, signal, backtest, source = t.run_update()
          dates = __import__("pandas").to_datetime(bars["时间"]).dt.date.nunique()
          print(f"5-minute history: {len(bars)} bars, {dates} trading dates, source={source}")
          print(f"Latest signal: {signal.get('action')} at {signal.get('time')}")
          PY
      - name: Commit score and T-strategy history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          git diff --cached --quiet || git commit -m "Update score and intraday T history"
          git push
